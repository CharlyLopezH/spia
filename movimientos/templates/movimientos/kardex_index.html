{% extends 'empleados/base.html' %}
{% block title %}Kardex de días - SEPIA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">

        <h4 class="mb-3">Kardex de días</h4>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="get" id="form-kardex">
                    <div class="mb-3">
                        <label class="form-label">Empleado</label>
                        <select name="empleado_id" class="form-select" required>
                            <option value="">— Selecciona un empleado —</option>
                            {% for emp in empleados %}
                                <option value="{{ emp.id }}">
                                    {{ emp.codigo }} — {{ emp.apellidos }} {{ emp.nombres }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Periodo</label>
                        <select name="periodo" class="form-select" required>
                            {% for p in periodos %}
                                <option value="{{ p }}" {% if p == periodo_actual %}selected{% endif %}>
                                    {{ p }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm">Ver kardex</button>
                </form>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('form-kardex').addEventListener('submit', function (e) {
        e.preventDefault();
        const emp = this.empleado_id.value;
        const per = this.periodo.value;
        if (!emp) return;
       //respetar el prefijo /spia/
        const urlBase = "{% url 'movimientos:kardex_periodo' 0 0 %}";
        // Reemplazar los ceros con los valores reales
        const urlFinal = urlBase.replace('/0/0/', `/${emp}/${per}/`);

        window.location.href = urlFinal;
    });
</script>
{% endblock %}
